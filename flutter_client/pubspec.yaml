name: invoicely_flutter
description: Cross-platform Flutter client for Invoicely AI.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  archive: ^4.0.0
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.2.0
  image_picker: ^1.1.2
  pdf: ^3.10.0
  printing: ^5.13.0
  qr: ^3.0.2
  share_plus: ^12.0.2
  shared_preferences: ^2.2.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
