# ===================================================================
# InvoicelyAi Backend - PRODUCTION PROFILE CONFIGURATION
# Profile: prod / production
# Active for Live Production environments (e.g. Render, AWS, Docker).
# ===================================================================

server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Connection (Production PostgreSQL)
# Credentials should be supplied via container/platform environment variables:
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}}
spring.datasource.username=${DB_USER:postgres.pggsnzcbkqyzcpjmcmqj}
spring.datasource.password=${DB_PASSWORD:Roshan96522@}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool (Tuned for High Concurrency)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=InvoicelyProdHikariPool

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# ddl-auto defaults to update (can be set to validate via DDL_AUTO env var)
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# -------------------------------------------------------------------
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# -------------------------------------------------------------------
# JWT Authentication & Role Security (Production Secrets)
# Must be overridden by secure environment variables in production
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:invoicelyai_supabase_postgres_super_secret_jwt_key_2026_secure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.developer.secret-key=${DEV_SECRET_KEY:invoicely_dev_secret_2026}
app.backend.base-url=${BACKEND_BASE_URL:https://invoicelyai.onrender.com/}

# -------------------------------------------------------------------
# Production Logging (Minimal overhead, high performance)
# -------------------------------------------------------------------
logging.level.com.invoicely.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR
