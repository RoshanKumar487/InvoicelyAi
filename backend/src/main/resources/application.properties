# ===================================================================
# InvoicelyAi Backend - Master Application Configuration
# ===================================================================

# -------------------------------------------------------------------
# Active Spring Profile Configuration
# Defaults to 'local' for local development & testing.
# Switch profile by passing SPRING_PROFILES_ACTIVE=uat or SPRING_PROFILES_ACTIVE=prod
# or via command line argument: --spring.profiles.active=prod
# -------------------------------------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.profiles.group.production=prod

# -------------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Default / Fallback Database Connection (Supabase PostgreSQL)
# Specific environments customize this in:
#   - application-local.properties
#   - application-uat.properties
#   - application-prod.properties
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres.pggsnzcbkqyzcpjmcmqj}
spring.datasource.password=${DB_PASSWORD:Roshan96522@}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# Swagger / OpenAPI Paths
# Available at: http://localhost:8080/swagger-ui/index.html
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# -------------------------------------------------------------------
# JPA Common Settings
# -------------------------------------------------------------------
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Backend Cloud Web Service Public URL (Render)
# -------------------------------------------------------------------
app.backend.base-url=${BACKEND_BASE_URL:https://invoicelyai.onrender.com/}

# -------------------------------------------------------------------
# JWT Security Defaults
# -------------------------------------------------------------------
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# AI provider configuration; supply the key through GEMINI_API_KEY.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
