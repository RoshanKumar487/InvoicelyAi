# ===================================================================
# InvoicelyAi Backend - Supabase PostgreSQL Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=/

# -------------------------------------------------------------------
# Supabase PostgreSQL Connection
# Replace with your Supabase Host and Database Password
# -------------------------------------------------------------------
# You can also pass these via Environment Variables:
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.pggsnzcbkqyzcpjmcmqj.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Roshan96522@}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool (Optimized for Cloud PostgreSQL)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# ddl-auto=update automatically creates/updates missing tables in Supabase
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# Available at: http://localhost:8080/swagger-ui/index.html
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# -------------------------------------------------------------------
# JWT Authentication & Role Security
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:invoicelyai_supabase_postgres_super_secret_jwt_key_2026_secure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.developer.secret-key=${DEV_SECRET_KEY:invoicely_dev_secret_2026}

