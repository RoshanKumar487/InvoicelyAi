# ===================================================================
# InvoicelyAi Backend - LOCAL PROFILE CONFIGURATION
# Profile: local
# Active for local development, rapid testing, and debugging.
# ===================================================================

server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Connection (Local Development)
# Default points to the development Supabase PostgreSQL instance.
# To connect to a local PostgreSQL server on your machine instead:
#   set DB_HOST=localhost and DB_PASSWORD=<your_local_password>
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres.pggsnzcbkqyzcpjmcmqj}
spring.datasource.password=${DB_PASSWORD:Roshan96522@}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool (Optimized for Local Dev)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=InvoicelyLocalHikariPool

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# ddl-auto=update automatically creates/updates missing tables locally
# show-sql & format_sql enable SQL query visibility in console for debugging
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# Available at: http://localhost:8080/swagger-ui/index.html
# -------------------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# -------------------------------------------------------------------
# JWT Authentication & Role Security (Local Dev Keys)
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:invoicelyai_supabase_postgres_super_secret_jwt_key_2026_secure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.developer.secret-key=${DEV_SECRET_KEY:invoicely_dev_secret_2026}
app.backend.base-url=${BACKEND_BASE_URL:https://invoicelyai.onrender.com/}
app.frontend.url=http://localhost:3000
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# -------------------------------------------------------------------
# Logging (Detailed output for local development)
# -------------------------------------------------------------------
logging.level.com.invoicely.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# -------------------------------------------------------------------
# SMTP Mail Configuration
# -------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:invoicelyai.notifications@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
app.mail.from-email=${MAIL_FROM_EMAIL:billing@invoicelyai.com}
app.mail.from-name=${MAIL_FROM_NAME:Invoicely AI Billing & Accounts}
