# ===================================================================
# InvoicelyAi Backend - UAT PROFILE CONFIGURATION
# Profile: uat
# Active for User Acceptance Testing & Staging environments.
# ===================================================================

server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Connection (UAT / Staging PostgreSQL)
# In UAT, pass DB_HOST, DB_NAME, DB_USER, DB_PASSWORD via environment variables
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.pggsnzcbkqyzcpjmcmqj.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres_uat}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Roshan96522@}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool (Staging Pool)
# -------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=InvoicelyUATHikariPool

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# Swagger / OpenAPI Documentation (Enabled for QA testing)
# Available at: http://<uat-host>:8080/swagger-ui/index.html
# -------------------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# -------------------------------------------------------------------
# JWT Authentication & Role Security (UAT Keys)
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:invoicelyai_uat_jwt_secret_key_change_in_env_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.developer.secret-key=${DEV_SECRET_KEY:invoicely_uat_dev_secret_2026}

# -------------------------------------------------------------------
# Logging (Balanced for staging diagnostics)
# -------------------------------------------------------------------
logging.level.com.invoicely.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
